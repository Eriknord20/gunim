name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Both platforms gunim draws on. The tests run offscreen, so a
    # runner needs no display and no sound card: anything that wants
    # real hardware skips itself.
    name: Vet, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      # unsafeptr off: the platform code pokes at the system's own
      # structures, which is what it is for, and the check cannot tell
      # that from a mistake. golangci-lint runs the rest of govet.
      - name: Vet
        run: go vet -unsafeptr=false ./...

      - name: Test
        run: go test ./...

      # Go moves a goroutine's stack only now and then, so a COM call that
      # writes through a pointer into a stack moved off passes the tests
      # above. This moves the stack at every call.
      - name: Test COM calls on moving stacks
        if: runner.os == 'Windows'
        run: go test "-gcflags=github.com/marrasen/gunim/filemanager=-d=maymorestack=runtime.mayMoreStackMove" -run StackMoves ./filemanager/

      # The tests on the real clipboard, named in the log. The ones in
      # internal/glfw fail rather than skip in CI when they cannot run,
      # and the step fails unless all five passed, so a rename cannot
      # leave it passing with nothing run. The one in driver/desktop
      # needs a display, which this runner lacks, so it skips here.
      - name: Test the clipboard
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go test -v -count=1 -run '^TestSensitive' ./internal/glfw/ ./driver/desktop/ | tee clipboard.log
          test "$(grep -c -- '--- PASS: TestSensitive' clipboard.log)" -ge 5

      - name: Build
        run: go build ./...

      # Nothing gunim ships needs cgo: the window, the sound and the
      # rest reach the system at run time. A build without it is what
      # keeps that true.
      - name: Build without cgo
        run: go build ./...
        env:
          CGO_ENABLED: 0

      # The browser is a platform of its own. It builds and vets here, and the
      # browser job runs the tests for its driver.
      - name: Vet and build for the browser
        if: runner.os == 'Linux'
        run: |
          GOOS=js GOARCH=wasm go vet -unsafeptr=false ./...
          GOOS=js GOARCH=wasm go build ./...

      # A type that is 64 bits here can be 32 elsewhere, and a linter run
      # on one machine cannot see that. Linux on 32-bit ARM is a real
      # place gunim runs.
      - name: Build for 32-bit Linux
        if: runner.os == 'Linux'
        run: |
          GOARCH=arm go build ./...
          GOARCH=386 go build ./...
        env:
          CGO_ENABLED: 0

  # Every package under the race detector, which runs them many times
  # slower. It runs beside the other jobs, in two parts of about the same
  # length: the plug-ins, and everything else. So it adds little to how
  # long CI takes.
  race:
    name: Test with the race detector, ${{ matrix.part }} (ubuntu-latest)
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: the plug-ins
            packages: ./audio/plug/...
          - part: the rest
            packages: rest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      # The list is made in a step of its own, so a failing go list stops
      # the job rather than leaving go test with no packages.
      - name: List the packages
        run: |
          if [ '${{ matrix.packages }}' = rest ]; then
            go list ./... | grep -v '/audio/plug\(/\|$\)' > "$RUNNER_TEMP/packages"
          else
            go list ${{ matrix.packages }} > "$RUNNER_TEMP/packages"
          fi
          test -s "$RUNNER_TEMP/packages"

      - name: Test with the race detector
        run: go test -race $(cat "$RUNNER_TEMP/packages")

  # Linux on 64-bit ARM. The audio packages hold assembly for arm64, the
  # JACK, PipeWire and Core Audio clients' callbacks, which their
  # tests run through fakes: with the macOS job, this is where that
  # assembly runs at all in CI.
  arm64:
    name: Vet, test audio (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet -unsafeptr=false ./...

      - name: Test audio
        run: go test ./audio/...

      # driver/kms, the touch screen's driver for a Raspberry Pi, on its own
      # architecture: its structures go to the kernel as they lie.
      - name: Test the KMS driver
        run: |
          go test ./driver/kms/ ./driver/internal/compose/
          go build ./driver/kms/... ./tools/kmsbench ./example/kmsdemo
          go vet -tags kmspi -unsafeptr=false ./driver/kms/
        env:
          CGO_ENABLED: 0

      - name: Test audio without cgo
        run: go test ./audio/internal/jack/ ./audio/internal/pipewire/ ./audio/internal/audiounit/ ./audio/speaker/
        env:
          CGO_ENABLED: 0

  # driver/kms on the kernel's virtual display, vkms, with Mesa drawing
  # on the CPU: the whole driver, from the modeset to blanking, on a
  # machine with no screen.
  vkms:
    name: Test the KMS driver on vkms (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Load vkms
        run: |
          uname -r
          sudo apt-get update -q
          sudo apt-get install -y -q libgbm1 libegl1 libegl-mesa0 libgles2
          modinfo vkms || find /lib/modules/"$(uname -r)" -name 'vkms*'
          sudo modprobe vkms
          ls -l /dev/dri
          for c in /sys/class/drm/card*-*; do echo "$c $(cat "$c/status")"; done

      - name: Test on vkms
        run: |
          go test -c -tags kmsvkms -o vkms.test ./driver/kms
          sudo ./vkms.test -test.v -test.run TestOnVKMS
        env:
          CGO_ENABLED: 0

  # macOS on Apple silicon. The Core Audio client's tests run its arm64
  # callbacks through a fake under Apple's calling convention, which
  # keeps x18 for itself, and load every function it calls from the
  # system's frameworks. The runners have no sound device, so the test
  # that plays through one skips.
  macos:
    name: Vet, test Core Audio (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet -unsafeptr=false ./...

      - name: Test Core Audio
        run: go test -race ./audio/internal/audiounit/ ./audio/driver/

      - name: Test opening files
        run: go test -race -run 'TestShowingAFileThatIsGoneSaysSo|TestOnlyAWebPageOpensAsALink' ./driver/desktop/

      - name: Test Core Audio without cgo
        run: go test ./audio/internal/audiounit/ ./audio/driver/
        env:
          CGO_ENABLED: 0

  # driver/web's tests need a real browser, and the runner fails if any of them
  # skips, so this runs them all. It tells Chrome its page has window focus.
  browser:
    name: Test the browser driver (Chrome, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Test in Chrome
        run: go run ./tools/webtest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The linter reads the standard library's export data through
      # golang.org/x/tools, and the x/tools in golangci-lint v2.13.2
      # cannot read Go 1.27.2's. 1.27.1 it can. Move both together.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: go.sum

      # Built from source with the Go set up above. The released binary
      # is built with an older Go, and cannot read the standard library
      # of a newer one.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          install-mode: goinstall

      # The step above lints for Linux. Windows files build only for
      # Windows, so they are linted again with the same binary.
      - name: Lint for Windows
        run: GOOS=windows "$(go env GOPATH)/bin/golangci-lint" run ./...

      # Likewise the browser.
      - name: Lint for the browser
        run: GOOS=js GOARCH=wasm "$(go env GOPATH)/bin/golangci-lint" run ./...
